name: Profile stats

on:
  schedule:
    - cron: "0 3 * * *"        # daily, 03:00 UTC
  workflow_dispatch:            # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_profile_stats.py"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          GH_USER: void032
          # Optional: add a classic PAT as repo secret PROFILE_TOKEN (scope: read:user)
          # to include private contributions. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_profile_stats.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
