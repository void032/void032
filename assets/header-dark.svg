<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 250" width="830" height="250" role="img" aria-label="VOID — Vineet Kumar, Creative Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="0" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#f0f6fc">VINEET KUMAR</text>
  <circle cx="722" cy="18" r="4" fill="#6e7681">
    <animate attributeName="fill" values="#6e7681;#6e7681;#3fb950;#3fb950" keyTimes="0;0.55;0.6;1" dur="4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" begin="4s" repeatCount="indefinite"/>
  </circle>
  <text x="830" y="22" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#8b949e">INITIALIZING
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.6;1" dur="4s" fill="freeze"/>
  </text>
  <text x="830" y="22" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#3fb950" opacity="0">ONLINE
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="4s" fill="freeze"/>
  </text>
  <line x1="0" y1="40.5" x2="830" y2="40.5" stroke="#30363d" stroke-dasharray="830" stroke-dashoffset="830">
    <animate attributeName="stroke-dashoffset" from="830" to="0" dur="1.2s" fill="freeze"/>
  </line>

  <text x="2" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#6e7681">01 /
    <tspan font-weight="700" fill="#f0f6fc">CREATIVE DEVELOPER</tspan>
  </text>

  <!-- wordmark: outline draws, then fills -->
  <text x="-6" y="216" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="160" font-weight="800" letter-spacing="-6" fill="none" stroke="#f0f6fc" stroke-width="1.5" stroke-dasharray="1400" stroke-dashoffset="1400">VOID
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="1.8s" begin="0.2s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.6s" begin="2s" fill="freeze"/>
  </text>
  <text x="-6" y="216" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="160" font-weight="800" letter-spacing="-6" fill="#f0f6fc" opacity="0">VOID
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.8s" fill="freeze"/>
  </text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#8b949e">
    <text x="830" y="120" text-anchor="end" opacity="0">3D WEB<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/></text>
    <text x="830" y="144" text-anchor="end" opacity="0">GLSL SHADERS<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/></text>
    <text x="830" y="168" text-anchor="end" opacity="0">DEVELOPER TOOLS<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.8s" fill="freeze"/></text>
    <text x="830" y="192" text-anchor="end" opacity="0">AI WORKFLOWS<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/></text>
  </g>
</svg>